<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="See the schedule before and after the run">
<defs><style>@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}@font-face{font-family:'Plex Condensed';src:url('../../fonts/ibm-plex-sans-condensed-latin-700-normal.woff2') format('woff2');font-weight:700}@font-face{font-family:'Plex Mono';src:url('../../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}</style><marker id="ah-474d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#474d6b"/></marker><marker id="ah-c9463b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9463b"/></marker><marker id="ah-0b7a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a86"/></marker><marker id="ah-2f9e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker><marker id="ah-8b90a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b90a0"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fbfcfe"/>
<text xml:space="preserve" x="80" y="100" font-family="Plex Condensed" font-size="52" font-weight="700" fill="#171a33" text-anchor="start">See the schedule before and after the run</text>
<text xml:space="preserve" x="80" y="150" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">Understand why a scenario waited, ran late or was skipped, and where the time went.</text>
<rect x="80" y="215" width="660" height="560" rx="16" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/>
<rect x="106" y="238" width="303" height="36" rx="18" fill="#fbe6e3"/><text xml:space="preserve" x="257.5" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#c9463b" text-anchor="middle">Cucumber.js on its own</text>
<text xml:space="preserve" x="106" y="322" font-family="Plex Sans" font-size="21" font-weight="600" fill="#737a96" text-anchor="start">The problem</text>
<g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="372" x2="122" y2="388"/><line x1="122" y1="372" x2="106" y2="388"/></g><text xml:space="preserve" x="142" y="387" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">No plan: the order is only visible while it</text><text xml:space="preserve" x="142" y="417" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">runs.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="484" x2="122" y2="500"/><line x1="122" y1="484" x2="106" y2="500"/></g><text xml:space="preserve" x="142" y="499" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Reports show a list, not what ran on which</text><text xml:space="preserve" x="142" y="529" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">worker.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="596" x2="122" y2="612"/><line x1="122" y1="596" x2="106" y2="612"/></g><text xml:space="preserve" x="142" y="611" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Finding the bottleneck means reading logs.</text>
<rect x="780" y="215" width="740" height="560" rx="16" fill="#ffffff" stroke="#0b7a86" stroke-width="3"/>
<rect x="806" y="238" width="78" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="845" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">bddr</text>
<rect x="810" y="290" width="330" height="230" rx="12" fill="#1a1d38"/><text xml:space="preserve" x="830" y="326" font-family="Plex Mono" font-size="17" font-weight="400" fill="#e8a2c9" text-anchor="start">bddr plan --explain pay</text><text xml:space="preserve" x="830" y="354" font-family="Plex Mono" font-size="17" font-weight="400" fill="#e7e9f5" text-anchor="start"></text><text xml:space="preserve" x="830" y="382" font-family="Plex Mono" font-size="17" font-weight="400" fill="#e7e9f5" text-anchor="start">pay</text><text xml:space="preserve" x="830" y="410" font-family="Plex Mono" font-size="17" font-weight="400" fill="#e7e9f5" text-anchor="start">  groups: payments (serial)</text><text xml:space="preserve" x="830" y="438" font-family="Plex Mono" font-size="17" font-weight="400" fill="#e7e9f5" text-anchor="start">  locks: payments-db</text><text xml:space="preserve" x="830" y="466" font-family="Plex Mono" font-size="17" font-weight="400" fill="#e7e9f5" text-anchor="start">  waits for: login, setup</text><text xml:space="preserve" x="830" y="494" font-family="Plex Mono" font-size="17" font-weight="400" fill="#e7e9f5" text-anchor="start">  needed by: reports</text><text xml:space="preserve" x="1160" y="318" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w1</text><line x1="1206" y1="342" x2="1480" y2="342" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="1160" y="370" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w2</text><line x1="1206" y1="394" x2="1480" y2="394" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="1160" y="422" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w3</text><line x1="1206" y1="446" x2="1480" y2="446" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="1160" y="474" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w4</text>