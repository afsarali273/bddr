<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Groups: parallel and serial work in one run">
<defs><style>@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}@font-face{font-family:'Plex Condensed';src:url('../../fonts/ibm-plex-sans-condensed-latin-700-normal.woff2') format('woff2');font-weight:700}@font-face{font-family:'Plex Mono';src:url('../../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}</style><marker id="ah-474d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#474d6b"/></marker><marker id="ah-c9463b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9463b"/></marker><marker id="ah-0b7a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a86"/></marker><marker id="ah-2f9e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker><marker id="ah-8b90a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b90a0"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fbfcfe"/>
<text xml:space="preserve" x="80" y="100" font-family="Plex Condensed" font-size="52" font-weight="700" fill="#171a33" text-anchor="start">Groups: parallel and serial work in one run</text>
<text xml:space="preserve" x="80" y="150" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">Setup first, checkout in parallel, payments one at a time, reports last, without splitting your CI into jobs.</text>
<rect x="80" y="215" width="660" height="560" rx="16" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/>
<rect x="106" y="238" width="303" height="36" rx="18" fill="#fbe6e3"/><text xml:space="preserve" x="257.5" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#c9463b" text-anchor="middle">Cucumber.js on its own</text>
<text xml:space="preserve" x="106" y="322" font-family="Plex Sans" font-size="21" font-weight="600" fill="#737a96" text-anchor="start">The problem</text>
<g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="372" x2="122" y2="388"/><line x1="122" y1="372" x2="106" y2="388"/></g><text xml:space="preserve" x="142" y="387" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">--parallel runs every scenario the same way:</text><text xml:space="preserve" x="142" y="417" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">all at once.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="484" x2="122" y2="500"/><line x1="122" y1="484" x2="106" y2="500"/></g><text xml:space="preserve" x="142" y="499" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">No "run setup first" or "reports last".</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="596" x2="122" y2="612"/><line x1="122" y1="596" x2="106" y2="612"/></g><text xml:space="preserve" x="142" y="611" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Teams split the suite into separate jobs and</text><text xml:space="preserve" x="142" y="641" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">glue them with shell scripts.</text>
<rect x="780" y="215" width="740" height="560" rx="16" fill="#ffffff" stroke="#0b7a86" stroke-width="3"/>
<rect x="806" y="238" width="78" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="845" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">bddr</text>
<text xml:space="preserve" x="800" y="318" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w1</text><line x1="846" y1="342" x2="1490" y2="342" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="800" y="382" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w2</text><line x1="846" y1="406" x2="1490" y2="406" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="800" y="446" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w3</text><line x1="846" y1="470" x2="1490" y2="470" stroke="#d5d9e6" stroke-width="2"/><rect x="850" y="292" width="110" height="44" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="905" y="321" font-family="Plex Sans" font-size="18" font-weight="600" fill="#8b90a0" text-anchor="middle">setup</text><rect x="980" y="292" width="120" height="44" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="1040" y="321" font-family="Plex Sans" font-size="18" font-weight="600" fill="#0b7a86" text-anchor="middle">checkout</text><rect x="980" y="356" width="120" height="44" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="1040" y="385" font-family="Plex Sans" font-size="18" font-weight="600" fill="#0b7a86" text-anchor="middle">checkout</text><rect x="980" y="420" width="120" height="44" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="1040" y="449" font-family="Plex Sans" font-size="18" font-weight="600" fill="#0b7a86" text-anchor="middle">checkout</text><rect x="1120" y="292" width="110" height="44" rx="10" fill="#eceaf9" stroke="#6a5fc4" stroke-width="2"/><text xml:space="preserve" x="1175" y="321" font-family="Plex Sans" font-size="17" font-weight="600" fill="#6a5fc4" text-anchor="middle">payments 1</text><rect x="1240" y="292" width="110" height="44" rx="10" fill="#eceaf9" stroke="#6a5fc4" stroke-width="2"/><text xml:space="preserve" x="1295" y="321" font-family="Plex Sans" font-size="17" font-weight="600" fill="#6a5fc4" text-anchor="middle">payments 2</text><rect x="1370" y="292" width="100" height="44" rx="10" fill="#faf0d9" stroke="#b87d12" stroke-width="2"/><text xml:space="preserve" x="1420" y="321" font-family="Plex Sans" font-size="18" font-weight="600" fill="#b87d12" text-anchor="middle">reports</text><text xml:space="preserve" x="860" y="506" font-family="Plex Sans" font-size="19" font-weight="400" fill="#474d6b" text-anchor="start">serial, first  ·  parallel x3  ·  serial + lock  ·  runs last</text>
<rect x="806" y="534" width="690" height="226" rx="12" fill="#1a1d38"/><text xml:space="preserve" x="830" y="576" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">groups: {</text><text xml:space="preserve" x="830" y="608" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  setup:    { mode: 'serial' },</text><text xml:space="preserve" x="830" y="640" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  checkout: { workers: 3, dependsOn: ['setup'] },</text><text xml:space="preserve" x="830" y="672" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  payments: { mode: 'serial', locks: ['db'] },</text><text xml:space="preserve" x="830" y="704" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  reports:  { dependsOn: ['checkout', 'payments'] },</text><text xml:space="preserve" x="830" y="736" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">}</text>
<rect x="80" y="810" width="1440" height="56" rx="14" fill="#0b7a86"/><text xml:space="preserve" x="800" y="846" font-family="Plex Sans" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">One command, one schedule. bddr plan shows it before you run.</text>
</svg>