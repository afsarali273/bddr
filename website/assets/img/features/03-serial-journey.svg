<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Serial journeys inside a parallel run">
<defs><style>@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}@font-face{font-family:'Plex Condensed';src:url('../../fonts/ibm-plex-sans-condensed-latin-700-normal.woff2') format('woff2');font-weight:700}@font-face{font-family:'Plex Mono';src:url('../../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}</style><marker id="ah-474d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#474d6b"/></marker><marker id="ah-c9463b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9463b"/></marker><marker id="ah-0b7a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a86"/></marker><marker id="ah-2f9e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker><marker id="ah-8b90a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b90a0"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fbfcfe"/>
<text xml:space="preserve" x="80" y="100" font-family="Plex Condensed" font-size="52" font-weight="700" fill="#171a33" text-anchor="start">Serial journeys inside a parallel run</text>
<text xml:space="preserve" x="80" y="150" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">A checkout journey (log in, add to basket, pay) must run in order and keep one browser, while the rest of the</text><text xml:space="preserve" x="80" y="182" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">suite runs in parallel.</text>
<rect x="80" y="215" width="660" height="560" rx="16" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/>
<rect x="106" y="238" width="303" height="36" rx="18" fill="#fbe6e3"/><text xml:space="preserve" x="257.5" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#c9463b" text-anchor="middle">Cucumber.js on its own</text>
<text xml:space="preserve" x="106" y="322" font-family="Plex Sans" font-size="21" font-weight="600" fill="#737a96" text-anchor="start">The problem</text>
<g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="372" x2="122" y2="388"/><line x1="122" y1="372" x2="106" y2="388"/></g><text xml:space="preserve" x="142" y="387" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Scenarios run in any order, on any worker.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="484" x2="122" y2="500"/><line x1="122" y1="484" x2="106" y2="500"/></g><text xml:space="preserve" x="142" y="499" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">To keep a journey in order you merge it into</text><text xml:space="preserve" x="142" y="529" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">one huge scenario...</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="596" x2="122" y2="612"/><line x1="122" y1="596" x2="106" y2="612"/></g><text xml:space="preserve" x="142" y="611" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">...or run the whole suite serially.</text>
<rect x="780" y="215" width="740" height="560" rx="16" fill="#ffffff" stroke="#0b7a86" stroke-width="3"/>
<rect x="806" y="238" width="78" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="845" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">bddr</text>
<text xml:space="preserve" x="800" y="318" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w1</text><line x1="846" y1="342" x2="1490" y2="342" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="800" y="382" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w2</text><line x1="846" y1="406" x2="1490" y2="406" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="800" y="446" font-family="Plex Mono" font-size="19" font-weight="400" fill="#737a96" text-anchor="start">w3</text><line x1="846" y1="470" x2="1490" y2="470" stroke="#d5d9e6" stroke-width="2"/><rect x="852" y="288" width="450" height="56" rx="14" fill="none" stroke="#0b7a86" stroke-width="2" stroke-dasharray="8 6"/><text xml:space="preserve" x="1082" y="282" font-family="Plex Sans" font-size="17" font-weight="600" fill="#0b7a86" text-anchor="middle">one browser session</text><rect x="862" y="296" width="130" height="40" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="927" y="323" font-family="Plex Sans" font-size="17" font-weight="600" fill="#0b7a86" text-anchor="middle">1 log in</text><rect x="1002" y="296" width="140" height="40" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="1072" y="323" font-family="Plex Sans" font-size="17" font-weight="600" fill="#0b7a86" text-anchor="middle">2 add item</text><rect x="1152" y="296" width="140" height="40" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="1222" y="323" font-family="Plex Sans" font-size="17" font-weight="600" fill="#0b7a86" text-anchor="middle">3 pay</text><rect x="862" y="360" width="200" height="40" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="962" y="387" font-family="Plex Sans" font-size="17" font-weight="600" fill="#8b90a0" text-anchor="middle">search feature</text><rect x="1072" y="360" width="200" height="40" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="1172" y="387" font-family="Plex Sans" font-size="17" font-weight="600" fill="#8b90a0" text-anchor="middle">profile feature</text><rect x="862" y="424" width="260" height="40" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="992" y="451" font-family="Plex Sans" font-size="17" font-weight="600" fill="#8b90a0" text-anchor="middle">catalogue feature</text><rect x="1132" y="424" width="180" height="40" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="1222" y="451" font-family="Plex Sans" font-size="17" font-weight="600" fill="#8b90a0" text-anchor="middle">admin feature</text>
<rect x="806" y="566" width="690" height="194" rx="12" fill="#1a1d38"/><text xml:space="preserve" x="830" y="608" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">@serial @reuseContext</text><text xml:space="preserve" x="830" y="640" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">Feature: Checkout journey</text><text xml:space="preserve" x="830" y="672" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  Scenario: Log in</text><text xml:space="preserve" x="830" y="704" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  Scenario: Add to basket</text><text xml:space="preserve" x="830" y="736" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  Scenario: Pay</text>
<rect x="80" y="810" width="1440" height="56" rx="14" fill="#0b7a86"/><text xml:space="preserve" x="800" y="846" font-family="Plex Sans" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Ordered scenarios, one shared session, and everything else still in parallel.</text>
</svg>