<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Repeat and retry a single step from the feature file">
<defs><style>@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}@font-face{font-family:'Plex Condensed';src:url('../../fonts/ibm-plex-sans-condensed-latin-700-normal.woff2') format('woff2');font-weight:700}@font-face{font-family:'Plex Mono';src:url('../../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}</style><marker id="ah-474d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#474d6b"/></marker><marker id="ah-c9463b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9463b"/></marker><marker id="ah-0b7a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a86"/></marker><marker id="ah-2f9e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker><marker id="ah-8b90a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b90a0"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fbfcfe"/>
<text xml:space="preserve" x="80" y="100" font-family="Plex Condensed" font-size="52" font-weight="700" fill="#171a33" text-anchor="start">Repeat and retry a single step from the feature file</text>
<text xml:space="preserve" x="80" y="150" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">Wait for a slow report to be ready, or create 100 users, without writing loops in step code.</text>
<rect x="80" y="215" width="660" height="560" rx="16" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/>
<rect x="106" y="238" width="303" height="36" rx="18" fill="#fbe6e3"/><text xml:space="preserve" x="257.5" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#c9463b" text-anchor="middle">Cucumber.js on its own</text>
<text xml:space="preserve" x="106" y="322" font-family="Plex Sans" font-size="21" font-weight="600" fill="#737a96" text-anchor="start">The problem</text>
<g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="372" x2="122" y2="388"/><line x1="122" y1="372" x2="106" y2="388"/></g><text xml:space="preserve" x="142" y="387" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Polling loops and sleeps live inside step</text><text xml:space="preserve" x="142" y="417" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">code.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="484" x2="122" y2="500"/><line x1="122" y1="484" x2="106" y2="500"/></g><text xml:space="preserve" x="142" y="499" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Bulk data needs a for loop in each step.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="596" x2="122" y2="612"/><line x1="122" y1="596" x2="106" y2="612"/></g><text xml:space="preserve" x="142" y="611" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Nothing shows attempts in the report.</text>
<rect x="780" y="215" width="740" height="560" rx="16" fill="#ffffff" stroke="#0b7a86" stroke-width="3"/>
<rect x="806" y="238" width="78" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="845" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">bddr</text>
<text xml:space="preserve" x="810" y="308" font-family="Plex Mono" font-size="21" font-weight="400" fill="#171a33" text-anchor="start">Then the report is ready  @retry:5 @delay:2s</text><circle cx="830" cy="352" r="22" fill="#fbe6e3" stroke="#c9463b" stroke-width="3"/><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="822" y1="344" x2="838" y2="360"/><line x1="838" y1="344" x2="822" y2="360"/></g><circle cx="900" cy="352" r="22" fill="#fbe6e3" stroke="#c9463b" stroke-width="3"/><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="892" y1="344" x2="908" y2="360"/><line x1="908" y1="344" x2="892" y2="360"/></g><circle cx="970" cy="352" r="22" fill="#fbe6e3" stroke="#c9463b" stroke-width="3"/><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="962" y1="344" x2="978" y2="360"/><line x1="978" y1="344" x2="962" y2="360"/></g><circle cx="1040" cy="352" r="22" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="3"/><path d="M1030 352 l7 8 l14 -17" fill="none" stroke="#2f9e6e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text xml:space="preserve" x="1110" y="360" font-family="Plex Sans" font-size="19" font-weight="400" fill="#474d6b" text-anchor="start">passed on attempt 4, recorded</text><text xml:space="preserve" x="810" y="440" font-family="Plex Mono" font-size="21" font-weight="400" fill="#171a33" text-anchor="start">When I create user "u{{i}}"  @repeat:100 @concurrency:10</text><rect x="810" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="874" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="938" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1002" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1066" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1130" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1194" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1258" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1322" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1386" y="462" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="810" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="874" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="938" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1002" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1066" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1130" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1194" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1258" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1322" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><rect x="1386" y="492" width="54" height="22" rx="5" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="1.5"/><text xml:space="preserve" x="1450" y="540" font-family="Plex Sans" font-size="18" font-weight="400" fill="#474d6b" text-anchor="end">x 100, ten at a time</text>
<rect x="806" y="598" width="690" height="162" rx="12" fill="#1a1d38"/><text xml:space="preserve" x="830" y="640" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">Then the report is ready @retry:5 @delay:2s @timeout:30s</text><text xml:space="preserve" x="830" y="672" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">When I create user "u{{i}}" @repeat:100 @concurrency:10</text><text xml:space="preserve" x="830" y="704" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start"></text><text xml:space="preserve" x="830" y="736" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">@stepRetry:2   # default for the whole scenario</text>
<rect x="80" y="810" width="1440" height="56" rx="14" fill="#0b7a86"/><text xml:space="preserve" x="800" y="846" font-family="Plex Sans" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Each attempt is an event in the report. {{i}} and {{n}} fill in the iteration.</text>
</svg>