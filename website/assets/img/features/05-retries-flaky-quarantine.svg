<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Retries that tell the truth: flaky and quarantine">
<defs><style>@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}@font-face{font-family:'Plex Condensed';src:url('../../fonts/ibm-plex-sans-condensed-latin-700-normal.woff2') format('woff2');font-weight:700}@font-face{font-family:'Plex Mono';src:url('../../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}</style><marker id="ah-474d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#474d6b"/></marker><marker id="ah-c9463b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9463b"/></marker><marker id="ah-0b7a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a86"/></marker><marker id="ah-2f9e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker><marker id="ah-8b90a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b90a0"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fbfcfe"/>
<text xml:space="preserve" x="80" y="100" font-family="Plex Condensed" font-size="52" font-weight="700" fill="#171a33" text-anchor="start">Retries that tell the truth: flaky and quarantine</text>
<text xml:space="preserve" x="80" y="150" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">Retry flaky tests without hiding them, and keep a known-bad test visible without breaking the build.</text>
<rect x="80" y="215" width="660" height="560" rx="16" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/>
<rect x="106" y="238" width="303" height="36" rx="18" fill="#fbe6e3"/><text xml:space="preserve" x="257.5" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#c9463b" text-anchor="middle">Cucumber.js on its own</text>
<text xml:space="preserve" x="106" y="322" font-family="Plex Sans" font-size="21" font-weight="600" fill="#737a96" text-anchor="start">The problem</text>
<g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="372" x2="122" y2="388"/><line x1="122" y1="372" x2="106" y2="388"/></g><text xml:space="preserve" x="142" y="387" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">--retry makes a flaky run turn green, and</text><text xml:space="preserve" x="142" y="417" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">then nobody sees it.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="484" x2="122" y2="500"/><line x1="122" y1="484" x2="106" y2="500"/></g><text xml:space="preserve" x="142" y="499" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">No flakiness score, no quarantine.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="596" x2="122" y2="612"/><line x1="122" y1="596" x2="106" y2="612"/></g><text xml:space="preserve" x="142" y="611" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">No "retry the whole group" for linked</text><text xml:space="preserve" x="142" y="641" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">scenarios.</text>
<rect x="780" y="215" width="740" height="560" rx="16" fill="#ffffff" stroke="#0b7a86" stroke-width="3"/>
<rect x="806" y="238" width="78" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="845" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">bddr</text>
<rect x="810" y="290" width="150" height="56" rx="10" fill="#fbe6e3" stroke="#c9463b" stroke-width="2"/><text xml:space="preserve" x="885" y="325" font-family="Plex Sans" font-size="20" font-weight="600" fill="#c9463b" text-anchor="middle">attempt 1</text><line x1="962" y1="318" x2="1018" y2="318" stroke="#474d6b" stroke-width="3" marker-end="url(#ah-474d6b)"/><rect x="1022" y="290" width="150" height="56" rx="10" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="2"/><text xml:space="preserve" x="1097" y="325" font-family="Plex Sans" font-size="20" font-weight="600" fill="#2f9e6e" text-anchor="middle">attempt 2</text><rect x="1200" y="299" width="90.5" height="36" rx="18" fill="#faf0d9"/><text xml:space="preserve" x="1245.25" y="324" font-family="Plex Sans" font-size="19" font-weight="600" fill="#b87d12" text-anchor="middle">FLAKY</text><text xml:space="preserve" x="1306" y="324" font-family="Plex Sans" font-size="17" font-weight="400" fill="#474d6b" text-anchor="start">run passes, report flags it</text><rect x="810" y="380" width="330" height="56" rx="10" fill="#fbe6e3" stroke="#c9463b" stroke-width="2"/><text xml:space="preserve" x="975" y="415" font-family="Plex Sans" font-size="20" font-weight="600" fill="#c9463b" text-anchor="middle">Export to PDF  @quarantine</text><rect x="1170" y="390" width="240.5" height="36" rx="18" fill="#e1f3ea"/><text xml:space="preserve" x="1290.25" y="415" font-family="Plex Sans" font-size="19" font-weight="600" fill="#2f9e6e" text-anchor="middle">build stays green</text><rect x="810" y="460" width="650" height="70" rx="14" fill="none" stroke="#6a5fc4" stroke-width="2" stroke-dasharray="8 6"/><text xml:space="preserve" x="830" y="490" font-family="Plex Sans" font-size="19" font-weight="600" fill="#6a5fc4" text-anchor="start">group retry: login &gt; create &gt; pay re-run together</text><text xml:space="preserve" x="830" y="518" font-family="Plex Mono" font-size="17" font-weight="400" fill="#474d6b" text-anchor="start">retryMembers: 'failed'</text>
<rect x="806" y="566" width="690" height="194" rx="12" fill="#1a1d38"/><text xml:space="preserve" x="830" y="608" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">retry: { scenario: 2, on: ['/timed out/'] },</text><text xml:space="preserve" x="830" y="640" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">history: true,   // flakiness score per scenario</text><text xml:space="preserve" x="830" y="672" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start"></text><text xml:space="preserve" x="830" y="704" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">@quarantine @owner:ann</text><text xml:space="preserve" x="830" y="736" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">Scenario: Export to PDF</text>
<rect x="80" y="810" width="1440" height="56" rx="14" fill="#0b7a86"/><text xml:space="preserve" x="800" y="846" font-family="Plex Sans" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Retries stay honest: flaky is reported, quarantined never fails the build, and bddr history ranks the worst.</text>
</svg>