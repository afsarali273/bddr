<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Sharding that keeps related tests together">
<defs><style>@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}@font-face{font-family:'Plex Condensed';src:url('../../fonts/ibm-plex-sans-condensed-latin-700-normal.woff2') format('woff2');font-weight:700}@font-face{font-family:'Plex Mono';src:url('../../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}</style><marker id="ah-474d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#474d6b"/></marker><marker id="ah-c9463b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9463b"/></marker><marker id="ah-0b7a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a86"/></marker><marker id="ah-2f9e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker><marker id="ah-8b90a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b90a0"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fbfcfe"/>
<text xml:space="preserve" x="80" y="100" font-family="Plex Condensed" font-size="52" font-weight="700" fill="#171a33" text-anchor="start">Sharding that keeps related tests together</text>
<text xml:space="preserve" x="80" y="150" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">Split the suite across 4 CI machines without cutting a dependency chain, a group or a lock in half.</text>
<rect x="80" y="215" width="660" height="560" rx="16" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/>
<rect x="106" y="238" width="303" height="36" rx="18" fill="#fbe6e3"/><text xml:space="preserve" x="257.5" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#c9463b" text-anchor="middle">Cucumber.js on its own</text>
<text xml:space="preserve" x="106" y="322" font-family="Plex Sans" font-size="21" font-weight="600" fill="#737a96" text-anchor="start">The problem</text>
<g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="372" x2="122" y2="388"/><line x1="122" y1="372" x2="106" y2="388"/></g><text xml:space="preserve" x="142" y="387" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Teams split by file with a custom script.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="484" x2="122" y2="500"/><line x1="122" y1="484" x2="106" y2="500"/></g><text xml:space="preserve" x="142" y="499" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">A scenario that depends on another may land</text><text xml:space="preserve" x="142" y="529" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">on a different machine and fail.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="596" x2="122" y2="612"/><line x1="122" y1="596" x2="106" y2="612"/></g><text xml:space="preserve" x="142" y="611" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Shards are unbalanced, so one machine runs</text><text xml:space="preserve" x="142" y="641" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">3x longer.</text>
<rect x="780" y="215" width="740" height="560" rx="16" fill="#ffffff" stroke="#0b7a86" stroke-width="3"/>
<rect x="806" y="238" width="78" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="845" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">bddr</text>
<rect x="800" y="290" width="160" height="230" rx="10" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="880" y="318" font-family="Plex Sans" font-size="19" font-weight="600" fill="#171a33" text-anchor="middle">shard 1/4</text><rect x="978" y="290" width="160" height="230" rx="10" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="1058" y="318" font-family="Plex Sans" font-size="19" font-weight="600" fill="#171a33" text-anchor="middle">shard 2/4</text><rect x="1156" y="290" width="160" height="230" rx="10" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="1236" y="318" font-family="Plex Sans" font-size="19" font-weight="600" fill="#171a33" text-anchor="middle">shard 3/4</text><rect x="1334" y="290" width="160" height="230" rx="10" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/><text xml:space="preserve" x="1414" y="318" font-family="Plex Sans" font-size="19" font-weight="600" fill="#171a33" text-anchor="middle">shard 4/4</text><rect x="812" y="336" width="136" height="40" rx="10" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="2"/><text xml:space="preserve" x="880" y="363" font-family="Plex Sans" font-size="17" font-weight="600" fill="#2f9e6e" text-anchor="middle">create</text><rect x="812" y="384" width="136" height="40" rx="10" fill="#e1f3ea" stroke="#2f9e6e" stroke-width="2"/><text xml:space="preserve" x="880" y="411" font-family="Plex Sans" font-size="17" font-weight="600" fill="#2f9e6e" text-anchor="middle">cancel</text><line x1="880" y1="376" x2="880" y2="384" stroke="#2f9e6e" stroke-width="3"/><rect x="812" y="432" width="136" height="70" rx="10" fill="#eceaf9" stroke="#6a5fc4" stroke-width="2"/><text xml:space="preserve" x="880" y="474" font-family="Plex Sans" font-size="17" font-weight="600" fill="#6a5fc4" text-anchor="middle">@lock: db</text><rect x="990" y="336" width="136" height="110" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="1058" y="398" font-family="Plex Sans" font-size="17" font-weight="600" fill="#0b7a86" text-anchor="middle">checkout group</text><rect x="990" y="454" width="136" height="48" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="1058" y="485" font-family="Plex Sans" font-size="17" font-weight="600" fill="#8b90a0" text-anchor="middle">a</text><rect x="1168" y="336" width="136" height="70" rx="10" fill="#faf0d9" stroke="#b87d12" stroke-width="2"/><text xml:space="preserve" x="1236" y="378" font-family="Plex Sans" font-size="17" font-weight="600" fill="#b87d12" text-anchor="middle">serial feature</text><rect x="1168" y="414" width="136" height="88" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="1236" y="465" font-family="Plex Sans" font-size="17" font-weight="600" fill="#8b90a0" text-anchor="middle">b, c</text><rect x="1346" y="336" width="136" height="80" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="1414" y="383" font-family="Plex Sans" font-size="17" font-weight="600" fill="#0b7a86" text-anchor="middle">orders</text><rect x="1346" y="424" width="136" height="78" rx="10" fill="#eceef3" stroke="#8b90a0" stroke-width="2"/><text xml:space="preserve" x="1414" y="470" font-family="Plex Sans" font-size="17" font-weight="600" fill="#8b90a0" text-anchor="middle">d, e</text><text xml:space="preserve" x="800" y="552" font-family="Plex Sans" font-size="19" font-weight="400" fill="#474d6b" text-anchor="start">packed by recorded duration, so shards finish together</text>
<rect x="806" y="598" width="690" height="162" rx="12" fill="#1a1d38"/><text xml:space="preserve" x="830" y="640" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">npx bddr run --shard 1/4</text><text xml:space="preserve" x="830" y="672" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">npx bddr run --shard 2/4</text><text xml:space="preserve" x="830" y="704" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start"># ...every machine agrees, no coordination</text><text xml:space="preserve" x="830" y="736" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">npx bddr report events-*.ndjson -f html</text>
<rect x="80" y="810" width="1440" height="56" rx="14" fill="#0b7a86"/><text xml:space="preserve" x="800" y="846" font-family="Plex Sans" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Deterministic, balanced by history, and dependent scenarios never get separated. Results merge into one report.</text>
</svg>