<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="UI and API in one scenario, started only when needed">
<defs><style>@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');font-weight:400}@font-face{font-family:'Plex Sans';src:url('../../fonts/ibm-plex-sans-latin-600-normal.woff2') format('woff2');font-weight:600}@font-face{font-family:'Plex Condensed';src:url('../../fonts/ibm-plex-sans-condensed-latin-700-normal.woff2') format('woff2');font-weight:700}@font-face{font-family:'Plex Mono';src:url('../../fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');font-weight:400}</style><marker id="ah-474d6b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#474d6b"/></marker><marker id="ah-c9463b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9463b"/></marker><marker id="ah-0b7a86" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a86"/></marker><marker id="ah-2f9e6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e6e"/></marker><marker id="ah-8b90a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b90a0"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#fbfcfe"/>
<text xml:space="preserve" x="80" y="100" font-family="Plex Condensed" font-size="52" font-weight="700" fill="#171a33" text-anchor="start">UI and API in one scenario, started only when needed</text>
<text xml:space="preserve" x="80" y="150" font-family="Plex Sans" font-size="25" font-weight="400" fill="#474d6b" text-anchor="start">Create data through the API, check it in the browser, with Playwright or Selenium and axios, using one runner.</text>
<rect x="80" y="215" width="660" height="560" rx="16" fill="#ffffff" stroke="#d5d9e6" stroke-width="2"/>
<rect x="106" y="238" width="303" height="36" rx="18" fill="#fbe6e3"/><text xml:space="preserve" x="257.5" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#c9463b" text-anchor="middle">Cucumber.js on its own</text>
<text xml:space="preserve" x="106" y="322" font-family="Plex Sans" font-size="21" font-weight="600" fill="#737a96" text-anchor="start">The problem</text>
<g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="372" x2="122" y2="388"/><line x1="122" y1="372" x2="106" y2="388"/></g><text xml:space="preserve" x="142" y="387" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">The World class is hand-wired for each tool.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="484" x2="122" y2="500"/><line x1="122" y1="484" x2="106" y2="500"/></g><text xml:space="preserve" x="142" y="499" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">The browser starts for every scenario, even</text><text xml:space="preserve" x="142" y="529" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">API-only ones.</text><g stroke="#c9463b" stroke-width="3.5" stroke-linecap="round"><line x1="106" y1="596" x2="122" y2="612"/><line x1="122" y1="596" x2="106" y2="612"/></g><text xml:space="preserve" x="142" y="611" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">Switching Playwright for Selenium means</text><text xml:space="preserve" x="142" y="641" font-family="Plex Sans" font-size="23" font-weight="400" fill="#171a33" text-anchor="start">rewriting the glue.</text>
<rect x="780" y="215" width="740" height="560" rx="16" fill="#ffffff" stroke="#0b7a86" stroke-width="3"/>
<rect x="806" y="238" width="78" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="845" y="263" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">bddr</text>
<rect x="810" y="290" width="650" height="54" rx="12" fill="#ffffff" stroke="#737a96" stroke-width="2"/><text xml:space="preserve" x="1135" y="324" font-family="Plex Sans" font-size="19" font-weight="600" fill="#171a33" text-anchor="middle">Scenario: a post title from the API shows up in the browser</text><rect x="810" y="364" width="300" height="54" rx="10" fill="#e3f2f3" stroke="#0b7a86" stroke-width="2"/><text xml:space="preserve" x="960" y="398" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">When I fetch post 1</text><rect x="1124" y="373" width="203" height="36" rx="18" fill="#e3f2f3"/><text xml:space="preserve" x="1225.5" y="398" font-family="Plex Sans" font-size="19" font-weight="600" fill="#0b7a86" text-anchor="middle">{ api }  axios</text><rect x="810" y="436" width="300" height="54" rx="10" fill="#eceaf9" stroke="#6a5fc4" stroke-width="2"/><text xml:space="preserve" x="960" y="470" font-family="Plex Sans" font-size="19" font-weight="600" fill="#6a5fc4" text-anchor="middle">And I add it as a todo</text><rect x="1124" y="445" width="278" height="36" rx="18" fill="#eceaf9"/><text xml:space="preserve" x="1263" y="470" font-family="Plex Sans" font-size="19" font-weight="600" fill="#6a5fc4" text-anchor="middle">{ page }  playwright</text><text xml:space="preserve" x="810" y="524" font-family="Plex Sans" font-size="18" font-weight="400" fill="#474d6b" text-anchor="start">values travel in ctx.state. A scenario that only asks for { api } never opens a browser.</text>
<rect x="806" y="598" width="690" height="162" rx="12" fill="#1a1d38"/><text xml:space="preserve" x="830" y="640" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">plugins: [</text><text xml:space="preserve" x="830" y="672" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  axios({ baseURL }),</text><text xml:space="preserve" x="830" y="704" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">  playwright(),   // or selenium()</text><text xml:space="preserve" x="830" y="736" font-family="Plex Mono" font-size="21" font-weight="400" fill="#e7e9f5" text-anchor="start">],</text>
<rect x="80" y="810" width="1440" height="56" rx="14" fill="#0b7a86"/><text xml:space="preserve" x="800" y="846" font-family="Plex Sans" font-size="23" font-weight="600" fill="#ffffff" text-anchor="middle">Plugins add fixtures. Groups, retries, sharding and reports work the same with any of them.</text>
</svg>