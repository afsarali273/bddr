<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
<rect width="1200" height="560" fill="#fff"/>
<text x="40" y="52" font-size="22" font-weight="600" fill="#171A33">One run, four workers</text>
<text x="40" y="78" font-size="14" fill="#5B6385">Time runs left to right. Each block is a group of scenarios.</text>
