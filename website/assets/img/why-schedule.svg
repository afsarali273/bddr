<text x="40" y="166.0" font-size="17" font-weight="600" fill="#171A33">w1</text>
<line x1="130" y1="202" x2="1160" y2="202" stroke="#EEF0F7"/>
<text x="40" y="250.0" font-size="17" font-weight="600" fill="#171A33">w2</text>
<line x1="130" y1="286" x2="1160" y2="286" stroke="#EEF0F7"/>
<text x="40" y="334.0" font-size="17" font-weight="600" fill="#171A33">w3</text>
<line x1="130" y1="370" x2="1160" y2="370" stroke="#EEF0F7"/>
<text x="40" y="418.0" font-size="17" font-weight="600" fill="#171A33">w4</text>
<line x1="130" y1="454" x2="1160" y2="454" stroke="#EEF0F7"/>
<rect x="130" y="130" width="220" height="60" rx="6" fill="#0B7A86"/>
<text x="142" y="156" font-size="15" font-weight="600" fill="#fff">setup</text><text x="142" y="176" font-size="12.5" fill="#fff" fill-opacity=".92">serial</text>
<rect x="130" y="214" width="220" height="60" rx="6" fill="none" stroke="#C9CEDF" stroke-dasharray="5 4"/><text x="240.0" y="249.0" font-size="14" fill="#8A90AE" text-anchor="middle">waiting</text>
<rect x="130" y="298" width="220" height="60" rx="6" fill="none" stroke="#C9CEDF" stroke-dasharray="5 4"/><text x="240.0" y="333.0" font-size="14" fill="#8A90AE" text-anchor="middle">waiting</text>
<rect x="130" y="382" width="220" height="60" rx="6" fill="none" stroke="#C9CEDF" stroke-dasharray="5 4"/><text x="240.0" y="417.0" font-size="14" fill="#8A90AE" text-anchor="middle">waiting</text>
<rect x="370" y="130" width="330" height="60" rx="6" fill="#2F8F6B"/>
<text x="382" y="156" font-size="15" font-weight="600" fill="#fff">checkout</text><text x="382" y="176" font-size="12.5" fill="#fff" fill-opacity=".92">parallel, 3 workers</text>
<rect x="370" y="214" width="330" height="60" rx="6" fill="#2F8F6B"/>
<text x="382" y="250" font-size="15" font-weight="600" fill="#fff">checkout</text>
<rect x="370" y="298" width="330" height="60" rx="6" fill="#2F8F6B"/>
<text x="382" y="334" font-size="15" font-weight="600" fill="#fff">checkout</text>
<rect x="370" y="382" width="330" height="60" rx="6" fill="#B7791F"/>
<text x="382" y="408" font-size="15" font-weight="600" fill="#fff">payments</text><text x="382" y="428" font-size="12.5" fill="#fff" fill-opacity=".92">serial, holds lock payments-db</text>
<g transform="translate(662,396)" fill="none" stroke="#fff" stroke-width="2"><rect x="0" y="9" width="20" height="15" rx="3" fill="#fff" fill-opacity=".25"/><path d="M4 9 V6 a6 6 0 0 1 12 0 V9"/></g>
<rect x="720" y="130" width="440" height="60" rx="6" fill="#5B6385"/>
<text x="732" y="156" font-size="15" font-weight="600" fill="#fff">reports</text><text x="732" y="176" font-size="12.5" fill="#fff" fill-opacity=".92">runs after checkout and payments</text>
<text x="940" y="333.0" font-size="14" fill="#8A90AE" text-anchor="middle">other workers are free</text>
<text x="240" y="486" font-size="14" fill="#171A33" text-anchor="middle">1. setup first</text>
<text x="535" y="486" font-size="14" fill="#171A33" text-anchor="middle">2. parallel and serial groups side by side</text>
<text x="940" y="486" font-size="14" fill="#171A33" text-anchor="middle">3. reports last</text>
</svg>