<svg class="diagram-svg" viewBox="0 0 960 390" role="img" aria-labelledby="fs-t fs-d">
<title id="fs-t">How plugin fixtures live inside a worker</title>
<desc id="fs-d">A plugin registers fixtures. A worker process holds the worker-scope browser, features hold feature-scope values, and each scenario attempt gets its own page.</desc>
<defs>
  <marker id="a-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" class="d-head"/></marker>
  <marker id="p-fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" class="d-head accent"/></marker>
</defs>
<rect x="20" y="40" width="210" height="150" rx="8" class="d-box plug"/><text x="36" y="68" class="d-h accent" text-anchor="start">Plugin</text><text x="36" y="88" class="d-m" text-anchor="start">@bddr/playwright</text><text x="36" y="116" class="d-s" text-anchor="start">definePlugin({ setup })</text><text x="36" y="133" class="d-s" text-anchor="start">registers fixtures:</text><text x="36" y="150" class="d-s" text-anchor="start">  browser   (worker)</text><text x="36" y="167" class="d-s" text-anchor="start">  page        (scenario)</text><text x="20" y="24" class="d-h" text-anchor="start">1  Registered at start-up</text><path d="M230 115H270" class="d-line accent" marker-end="url(#p-fs)"/><text x="270" y="24" class="d-h" text-anchor="start">2  Created on first use, closed in reverse order</text><rect x="270" y="40" width="670" height="330" rx="8" class="d-box scope w"/><text x="288" y="66" class="d-h" text-anchor="start">Worker process</text><text x="930" y="66" class="d-s mono" text-anchor="end">scope: worker</text><rect x="298" y="82" width="614" height="208" rx="8" class="d-box scope f"/><text x="316" y="108" class="d-h" text-anchor="start">Feature</text><text x="896" y="108" class="d-s mono" text-anchor="end">scope: feature</text><rect x="326" y="124" width="558" height="130" rx="8" class="d-box scope s"/><text x="344" y="150" class="d-h" text-anchor="start">Scenario attempt</text><text x="868" y="150" class="d-s mono" text-anchor="end">scope: scenario</text><text x="344" y="176" class="d-m ink" text-anchor="start">Given I log in as "ann"</text><text x="344" y="196" class="d-s" text-anchor="start">    ({ page }) =&gt; ...      asks for page, so page is created now</text><text x="344" y="222" class="d-s" text-anchor="start">After hooks, then page closed</text><text x="344" y="242" class="d-s" text-anchor="start">A retry gets a fresh page</text><rect x="288" y="308" width="640" height="50" rx="8" class="d-box soft"/><text x="304" y="330" class="d-m ink" text-anchor="start">browser</text><text x="304" y="348" class="d-s" text-anchor="start">shared by every scenario in this worker. Closed after AfterWorker hooks.</text><text x="20" y="214" class="d-s" text-anchor="start">A fixture can use fixtures of its own scope</text><text x="20" y="232" class="d-s" text-anchor="start">or a longer one: a page can use the browser,</text><text x="20" y="250" class="d-s" text-anchor="start">never the other way round.</text>
</svg>
