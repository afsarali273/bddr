<svg class="diagram-svg" viewBox="0 0 960 420" role="img" aria-labelledby="rp-t rp-d">
<title id="rp-t">Life of a bddr run</title>
<desc id="rp-d">Feature files are parsed, selected, planned, scheduled and run. The run emits one event stream that every reporter reads.</desc>
<defs>
  <marker id="a-rp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" class="d-head"/></marker>
  <marker id="p-rp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" class="d-head accent"/></marker>
</defs>
<rect x="30" y="40" width="148" height="130" rx="8" class="d-box pkg"/><text x="46" y="70" class="d-h" text-anchor="start">Parse</text><text x="46" y="90" class="d-s mono" text-anchor="start">@bddr/core</text><text x="46" y="118" class="d-s" text-anchor="start">Feature files in,</text><text x="46" y="135" class="d-s" text-anchor="start">scenarios out, each</text><text x="46" y="152" class="d-s" text-anchor="start">with a stable id</text><path d="M178 105H218" class="d-line " marker-end="url(#a-rp)"/><rect x="218" y="40" width="148" height="130" rx="8" class="d-box pkg"/><text x="234" y="70" class="d-h" text-anchor="start">Select</text><text x="234" y="90" class="d-s mono" text-anchor="start">@bddr/core</text><text x="234" y="118" class="d-s" text-anchor="start">Paths, tags, names,</text><text x="234" y="135" class="d-s" text-anchor="start">ids. Hard dependencies</text><text x="234" y="152" class="d-s" text-anchor="start">are pulled in</text><path d="M366 105H406" class="d-line " marker-end="url(#a-rp)"/><rect x="406" y="40" width="148" height="130" rx="8" class="d-box pkg"/><text x="422" y="70" class="d-h" text-anchor="start">Plan</text><text x="422" y="90" class="d-s mono" text-anchor="start">@bddr/core</text><text x="422" y="118" class="d-s" text-anchor="start">Groups, dependencies,</text><text x="422" y="135" class="d-s" text-anchor="start">locks, priority.</text><text x="422" y="152" class="d-s" text-anchor="start">Plain data</text><path d="M554 105H594" class="d-line " marker-end="url(#a-rp)"/><rect x="594" y="40" width="148" height="130" rx="8" class="d-box pkg run"/><text x="610" y="70" class="d-h" text-anchor="start">Schedule</text><text x="610" y="90" class="d-s mono" text-anchor="start">@bddr/runtime</text><text x="610" y="118" class="d-s" text-anchor="start">Hands ready work to</text><text x="610" y="135" class="d-s" text-anchor="start">free workers, holds</text><text x="610" y="152" class="d-s" text-anchor="start">locks, applies retries</text><path d="M742 105H782" class="d-line " marker-end="url(#a-rp)"/><rect x="782" y="40" width="148" height="130" rx="8" class="d-box pkg run"/><text x="798" y="70" class="d-h" text-anchor="start">Run</text><text x="798" y="90" class="d-s mono" text-anchor="start">@bddr/runtime</text><text x="798" y="118" class="d-s" text-anchor="start">A worker runs hooks,</text><text x="798" y="135" class="d-s" text-anchor="start">steps and fixtures</text><text x="798" y="152" class="d-s" text-anchor="start">for one scenario</text><text x="30" y="24" class="d-s" text-anchor="start">Inputs: your feature files and bddr.config.ts</text><text x="480" y="212" class="d-s accent" text-anchor="middle">bddr plan prints this</text><path d="M480 198V173" class="d-line accent dash" marker-end="url(#p-rp)"/><rect x="20" y="250" width="920" height="44" rx="8" class="d-box bar"/><text x="480" y="277" class="d-h center-h" text-anchor="middle">One event stream (schema v1): runs, groups, scenarios, steps and retries are all events</text><path d="M856 170V250" class="d-line " marker-end="url(#a-rp)"/><text x="868" y="210" class="d-s" text-anchor="start">emits</text><path d="M89 294V326" class="d-line " marker-end="url(#a-rp)"/><rect x="20" y="328" width="138" height="40" rx="8" class="d-box plug"/><text x="89" y="353" class="d-m" text-anchor="middle">console</text><path d="M245 294V326" class="d-line " marker-end="url(#a-rp)"/><rect x="176" y="328" width="138" height="40" rx="8" class="d-box plug"/><text x="245" y="353" class="d-m" text-anchor="middle">html</text><path d="M401 294V326" class="d-line " marker-end="url(#a-rp)"/><rect x="332" y="328" width="138" height="40" rx="8" class="d-box plug"/><text x="401" y="353" class="d-m" text-anchor="middle">junit</text><path d="M557 294V326" class="d-line " marker-end="url(#a-rp)"/><rect x="488" y="328" width="138" height="40" rx="8" class="d-box plug"/><text x="557" y="353" class="d-m" text-anchor="middle">cucumber-json</text><path d="M713 294V326" class="d-line " marker-end="url(#a-rp)"/><rect x="644" y="328" width="138" height="40" rx="8" class="d-box plug"/><text x="713" y="353" class="d-m" text-anchor="middle">messages</text><path d="M869 294V326" class="d-line " marker-end="url(#a-rp)"/><rect x="800" y="328" width="138" height="40" rx="8" class="d-box plug"/><text x="869" y="353" class="d-m" text-anchor="middle">ndjson</text><text x="20" y="392" class="d-s" text-anchor="start">Reporters never touch the runner. They only read events, and any tool can read the ndjson file the same way.</text>
</svg>
