<title id="pk-t">bddr packages and their dependencies</title>
<desc id="pk-d">The CLI uses the runtime and the reporters. Both use core. Plugins sit outside and register fixtures with the runtime.</desc>

  <marker id="a-pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1l8 4-8 4" class="d-head"/></marker>

</defs>
<text x="30" y="30" class="d-h" text-anchor="start">Your project</text><rect x="30" y="44" width="184" height="56" rx="8" class="d-box soft"/><text x="44" y="68" class="d-m" text-anchor="start">features/*.feature</text><text x="44" y="88" class="d-s" text-anchor="start">the specs</text><rect x="230" y="44" width="184" height="56" rx="8" class="d-box soft"/><text x="244" y="68" class="d-m" text-anchor="start">steps/*.ts</text><text x="244" y="88" class="d-s" text-anchor="start">step code and fixtures</text><rect x="430" y="44" width="184" height="56" rx="8" class="d-box soft"/><text x="444" y="68" class="d-m" text-anchor="start">bddr.config.ts</text><text x="444" y="88" class="d-s" text-anchor="start">workers, groups, plugins</text><text x="662" y="30" class="d-h accent" text-anchor="start">Plugins you install</text><rect x="662" y="44" width="268" height="50" rx="8" class="d-box plug"/><text x="678" y="66" class="d-m accent" text-anchor="start">@bddr/playwright</text><text x="678" y="84" class="d-s" text-anchor="start">browser</text><rect x="662" y="106" width="268" height="50" rx="8" class="d-box plug"/><text x="678" y="128" class="d-m accent" text-anchor="start">@bddr/selenium</text><text x="678" y="146" class="d-s" text-anchor="start">browser</text><rect x="662" y="168" width="268" height="50" rx="8" class="d-box plug"/><text x="678" y="190" class="d-m accent" text-anchor="start">@bddr/axios</text><text x="678" y="208" class="d-s" text-anchor="start">HTTP client</text><text x="662" y="322" class="d-s" text-anchor="start">Each wraps a library your project installs.</text><text x="662" y="340" class="d-s" text-anchor="start">bddr itself depends on none of them.</text><rect x="30" y="130" width="580" height="60" rx="8" class="d-box pkg"/><text x="48" y="156" class="d-h" text-anchor="start">@bddr/cli</text><text x="48" y="177" class="d-s" text-anchor="start">bddr run, plan, report, docs, watch, debug. Reads the config and wires the rest together.</text><rect x="30" y="236" width="196" height="112" rx="8" class="d-box pkg"/><text x="48" y="262" class="d-h" text-anchor="start">@bddr/reporters</text><text x="48" y="284" class="d-s" text-anchor="start">console, html, junit</text><text x="48" y="301" class="d-s" text-anchor="start">cucumber-json, messages</text><text x="48" y="318" class="d-s" text-anchor="start">ndjson, living docs</text><rect x="238" y="236" width="372" height="112" rx="8" class="d-box pkg"/><text x="256" y="262" class="d-h" text-anchor="start">@bddr/runtime</text><text x="256" y="284" class="d-s" text-anchor="start">Step and hook registry, class steps</text><text x="256" y="301" class="d-s" text-anchor="start">Scheduler, inline and process pool</text><text x="256" y="318" class="d-s" text-anchor="start">Executor, retries, fixtures, context</text><text x="256" y="335" class="d-s" text-anchor="start">Plugin API (definePlugin)</text><rect x="30" y="392" width="580" height="112" rx="8" class="d-box pkg core"/><text x="48" y="418" class="d-h" text-anchor="start">@bddr/core</text><text x="48" y="442" class="d-s" text-anchor="start">Spec model and stable scenario ids</text><text x="328" y="442" class="d-s" text-anchor="start">Tags and selection</text><text x="48" y="462" class="d-s" text-anchor="start">The plan: groups, dependencies, locks, shards</text><text x="328" y="462" class="d-s" text-anchor="start">Data files and run history</text><text x="48" y="488" class="d-s" text-anchor="start">Event schema v1: the only thing reporters read</text><text x="662" y="392" class="d-h" text-anchor="start">Replaceable parts</text><text x="662" y="410" class="d-s" text-anchor="start">Cucumber libraries sit behind adapters:</text><rect x="662" y="422" width="268" height="22" rx="8" class="d-box soft"/><text x="674" y="437" class="d-s ink" text-anchor="start">gherkin parser</text><text x="918" y="437" class="d-s" text-anchor="end">core</text><rect x="662" y="450" width="268" height="22" rx="8" class="d-box soft"/><text x="674" y="465" class="d-s ink" text-anchor="start">tag expressions</text><text x="918" y="465" class="d-s" text-anchor="end">core</text><rect x="662" y="478" width="268" height="22" rx="8" class="d-box soft"/><text x="674" y="493" class="d-s ink" text-anchor="start">cucumber expressions</text><text x="918" y="493" class="d-s" text-anchor="end">runtime</text><path d="M128 190V236" class="d-line " marker-end="url(#a-pk)"/><path d="M424 190V236" class="d-line " marker-end="url(#a-pk)"/><path d="M128 348V392" class="d-line " marker-end="url(#a-pk)"/><path d="M424 348V392" class="d-line " marker-end="url(#a-pk)"/><path d="M796 224V292H610" class="d-line accent dash" marker-end="url(#p-pk)"/><text x="626" y="284" class="d-s accent" text-anchor="start">register fixtures</text><text x="140" y="218" class="d-s" text-anchor="start">writes reports</text><text x="436" y="218" class="d-s" text-anchor="start">runs the plan</text>
