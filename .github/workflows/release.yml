name: Release

# Publishes the packages to npm when a version tag is pushed, for example:  git tag v0.1.0 && git push origin v0.1.0
# Uses npm Trusted Publishing (OpenID Connect), so there is no npm token or secret.
# One-time setup, for each of the 7 packages on npmjs.com (Settings > Trusted Publisher > GitHub Actions):
#   organization or user: afsarali273   repository: bddr   workflow filename: release.yml   environment: (empty)
# A package must exist on npm before a trusted publisher can be added, so publish version 0.1.0 of each once by hand first.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets npm verify this workflow run; provenance is attached automatically

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use an npm version that supports trusted publishing (11.5.1 or newer)
        run: npm install -g npm@latest && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm run verify
      - name: Check the tag matches the package version
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - name: Publish (dependencies first)
        run: |
          for d in packages/core packages/runtime packages/reporters packages/cli; do
            (cd $d && npm publish --access public)
          done
          for d in plugins/playwright plugins/selenium plugins/axios; do
            (cd $d && npm ci && npm run build && npm publish --access public)
          done
